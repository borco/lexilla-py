# The docs moved to https://borco.github.io/scintilla-py/lexilla/ with the
# package (borco/scintilla-py). This deploys pages/, a redirect from every old
# docs URL to its new home; an archived repo's Pages site keeps serving it.
name: Docs

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages

      - id: deployment
        uses: actions/deploy-pages@v5
